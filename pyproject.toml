[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[project]
name = "template-python"
version = "0.1.0"
description = "A modern, reproducible Python project template for research and papers."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]
keywords = ["python", "reproducibility", "research", "template"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.5.3",
]

[dependency-groups]
analysis = [
  "ipykernel>=7.4.0",
  "jupyterlab>=4.6.4",
  "matplotlib>=3.11.2",
  "pandas>=3.0.6",
  "scipy>=1.18.1",
]
build = [
  "build>=1.6.1",
  "twine>=7.0.0",
]
quality = [
  "mypy>=2.4.0",
  "prek>=0.5.5",
  "ruff>=0.16.10",
]
test = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
]
dev = [
  { include-group = "build" },
  { include-group = "quality" },
  { include-group = "test" },
]

[project.scripts]
template-python = "template_python.cli:main"

[project.urls]
Homepage = "https://github.com/LouieSlocombe/template_python_paper"
Issues = "https://github.com/LouieSlocombe/template_python_paper/issues"
Repository = "https://github.com/LouieSlocombe/template_python_paper"

[tool.pytest]
addopts = ["--import-mode=importlib", "-ra"]
minversion = "9.0"
strict = true
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["template_python"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
fail_under = 95
show_missing = true
skip_covered = true

[tool.mypy]
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
]
files = ["src", "tests"]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle errors
  "EM",   # flake8-errmsg
  "F",    # Pyflakes
  "FURB", # refurb
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "NPY",  # NumPy-specific rules
  "PERF", # Perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # Pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "TC",   # flake8-type-checking
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"analysis/**" = ["D"]
"tests/**" = ["D", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"
