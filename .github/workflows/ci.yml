name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project and quality tools
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --editable .
          python -m pip install --group quality
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy template_python tests

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project and test tools
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --editable .
          python -m pip install --group test
      - run: python -m pytest --cov

  package:
    name: Build package
    needs: [quality, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group build
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/template-wheel-test
          /tmp/template-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/template-wheel-test/bin/template-python --points 3
